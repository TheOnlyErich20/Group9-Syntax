<!-- Subjects.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subjects - Darkboard</title>
  <link rel="stylesheet" href="Darkboard.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"/>
</head>
<body>
  <div class="dashboard-wrapper">
    <!-- Sidebar Navigation (unchanged) -->
    <aside class="sidebar">
      <!-- your sidebar links -->
    </aside>

    <!-- Main Content -->
    <main class="dashboard-content">
      <section class="subjects-section">
        <div class="subjects-header">
          <h1>My Subjects</h1>
          <p>Track your school subjects and grades</p>
        </div>

        <div class="add-subject">
          <button id="addSubjectBtn" class="btn-add-subject">
            <i class="fas fa-plus"></i> Add New Subject
          </button>
        </div>

        <!-- Add Subject Modal -->
        <div class="modal" id="addSubjectModal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
              <h2>Add New Subject</h2>
              <form id="addSubjectForm">
                <label for="newSubjectName">Subject Name:</label>
                <input type="text" id="newSubjectName" name="newSubjectName" required/>

                <label for="newTeacherName">Teacher:</label>
                <input type="text" id="newTeacherName" name="newTeacherName" required/>

                <label for="newSubjectTime">Time:</label>
                <input type="text" id="newSubjectTime" name="newSubjectTime" required/>

                <label for="newSubjectGrade">Current Grade:</label>
                <input type="text" id="newSubjectGrade" name="newSubjectGrade"/>

                <label for="newSubjectDescription">Description:</label>
                <textarea id="newSubjectDescription" name="newSubjectDescription"></textarea>

                <button type="submit" class="btn-add-subject">
                  <i class="fas fa-check"></i> Save Subject
                </button>
              </form>
            </div>
          </div>
        </div>

        <!-- Subject Detail Modal -->
        <div class="modal" id="subjectModal">
          <div class="modal-content">
            <span class="close">&times;</span>
            <div class="modal-body">
              <h2 id="modalTitle"></h2>
              <div class="modal-details">
                <p><strong>Teacher:</strong> <span id="modalTeacher"></span></p>
                <p><strong>Time:</strong> <span id="modalTime"></span></p>
                <p><strong>Current Grade:</strong> <span id="modalGrade"></span></p>
                <p><strong>Description:</strong> <span id="modalDescription"></span></p>
              </div>
              <button class="btn-edit">Edit Subject</button>
            </div>
          </div>
        </div>

        <div class="subjects-container">
          <!-- Subjects generated dynamically -->
        </div>
      </section>
    </main>
  </div>

  <!-- Only module imports -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
