<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subjects - Darkboard</title>

    <!-- Main CSS -->
    <link rel="stylesheet" href="Darkboard.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"/>

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="dashboard-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar">
        <a href="index.html" class="brand">DARKBOARD</a>

        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <i class="fas fa-th-large"></i>
            <span>Dashboard</span>
          </a>

          <a href="Subjects.html" class="nav-item active">
            <i class="fas fa-book"></i>
            <span>Subjects</span>
          </a>

          <a href="Grades.html" class="nav-item">
            <i class="fas fa-chart-bar"></i>
            <span>Grades</span>
          </a>

          <a href="Schedule.html" class="nav-item">
            <i class="fas fa-calendar-alt"></i>
            <span>Schedule</span>
          </a>

          <a href="Announcements.html" class="nav-item">
            <i class="fas fa-bell"></i>
            <span>Announcements</span>
          </a>

          <hr
            style="
              border: 0;
              border-top: 1px solid rgba(255, 255, 255, 0.1);
              margin: 10px 0;
            "
          />

          <a href="Profile.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Profile</span>
          </a>

          <a href="Settings.html" class="nav-item">
            <i class="fas fa-cog"></i>
            <span>Settings</span>
          </a>

          <a href="Help.html" class="nav-item">
            <i class="fas fa-question-circle"></i>
            <span>Help</span>
          </a>

          <a href="#" id="logoutBtn" class="nav-item">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="dashboard-content">
        <section class="subjects-section">
          <div class="subjects-header">
            <h1>My Subjects</h1>
            <p>Track your school subjects and grades</p>
          </div>

          <!-- Split Layout -->
          <div class="subjects-content-wrapper">
            <!-- Left Sidebar: List -->
            <div class="subjects-sidebar">
              <div class="sidebar-header">
                <h3>Subject List</h3>
                <button id="addSubjectBtn" class="btn-add-mini" title="Add Subject">
                  <i class="fas fa-plus"></i>
                </button>
              </div>
              <div class="subjects-list" id="subjectsList">
                <!-- List items injected here -->
              </div>
            </div>

            <!-- Right Panel: Details -->
            <div class="subject-details" id="subjectDetailsPanel">
              <div class="empty-state">
                <i class="fas fa-book-open"></i>
                <p>Select a subject from the list to view details and lessons.</p>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Add Subject Modal -->
    <div class="modal" id="addSubjectModal">
      <div class="modal-content">
        <span class="close" onclick="document.getElementById('addSubjectModal').style.display='none'">&times;</span>
        <div class="modal-body">
          <h2>Add New Subject</h2>
          <form id="addSubjectForm">
            <div class="form-group">
              <label>Subject Name</label>
              <input type="text" id="newSubjectName" required placeholder="e.g. Mathematics" />
            </div>
            <div class="form-group">
              <label>Teacher</label>
              <input type="text" id="newTeacherName" required placeholder="e.g. Mr. Anderson" />
            </div>
            <div class="form-group">
              <label>Time</label>
              <input type="text" id="newSubjectTime" required placeholder="e.g. 08:00 AM - 09:30 AM" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="newSubjectDescription" rows="5" placeholder="Brief description..."></textarea>
            </div>
            <button type="submit" class="btn-add-subject">
              <i class="fas fa-check"></i> Save Subject
            </button>
          </form>

          <!-- Inline form handler - waits for Firebase to load -->
          <script>
            function initAddSubjectForm() {
              const form = document.getElementById('addSubjectForm');
              const modal = document.getElementById('addSubjectModal');
              const addBtn = document.getElementById('addSubjectBtn');
              
              if (!form) {
                console.log('Form not found, retrying...');
                setTimeout(initAddSubjectForm, 100);
                return;
              }
              
              console.log('Add Subject form initialized');
              
              // Open modal handler
              if (addBtn && modal) {
                addBtn.addEventListener('click', function() {
                  modal.style.display = 'block';
                });
              }
              
              // Close modal when clicking outside
              window.addEventListener('click', function(e) {
                if (e.target === modal) {
                  modal.style.display = 'none';
                }
              });
              
              form.addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('Form submitted');
                
                const name = document.getElementById('newSubjectName').value.trim();
                const teacher = document.getElementById('newTeacherName').value.trim();
                const time = document.getElementById('newSubjectTime').value.trim();
                const description = document.getElementById('newSubjectDescription').value.trim();
                
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                
                if (!name || !teacher || !time) {
                  alert('Please fill in all required fields');
                  return;
                }
                
                const subjectData = {
                  name: name,
                  teacher: teacher,
                  time: time,
                  description: description,
                  instructorId: userData.id,
                  instructorName: userData.name,
                  createdAt: new Date()
                };
                
                console.log('Saving:', subjectData);
                
                // Wait for Firebase to be ready
                function saveToFirestore() {
                  if (typeof firebase !== 'undefined' && firebase.firestore) {
                    firebase.firestore().collection('subjects').add(subjectData)
                      .then(function(docRef) {
                        console.log('Saved with ID:', docRef.id);
                        alert('Subject added successfully!');
                        form.reset();
                        modal.style.display = 'none';
                        location.reload();
                      })
                      .catch(function(err) {
                        console.error('Error:', err);
                        alert('Error saving: ' + err.message);
                      });
                  } else {
                    console.log('Waiting for Firebase...');
                    setTimeout(saveToFirestore, 200);
                  }
                }
                
                saveToFirestore();
              });
            }
            
            // Start initialization
            initAddSubjectForm();
          </script>
        </div>
      </div>
    </div>

    <!-- Add Task Modal -->
    <div class="modal" id="addTaskModal">
      <div class="modal-content">
        <span class="close" onclick="closeTaskModal()">&times;</span>
        <div class="modal-body">
          <h2 id="taskModalTitle">Add New Task</h2>
          <form id="addTaskForm">
            <input type="hidden" id="editTaskId" value="" />
            <div class="form-group">
              <label>Task Title</label>
              <input type="text" id="taskTitle" required placeholder="e.g. Assignment 1" />
            </div>
            <div class="form-group">
              <label>Description</label>
              <textarea id="taskDescription" rows="3" placeholder="Task instructions..."></textarea>
            </div>
            <div class="form-group">
              <label>Due Date</label>
              <input type="datetime-local" id="taskDueDate" required />
            </div>
            <div class="form-group">
              <label>Max Score</label>
              <input type="number" id="taskMaxScore" required placeholder="100" min="1" />
            </div>
            <div class="form-group">
              <label>Attachment (Optional)</label>
              <input type="file" id="taskFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png" />
            </div>
            <button type="submit" class="btn-add-subject">
              <i class="fas fa-check"></i> <span id="taskBtnText">Save Task</span>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- File Upload Modal -->
    <div class="modal" id="uploadFileModal">
      <div class="modal-content">
        <span class="close" onclick="closeUploadModal()">&times;</span>
        <div class="modal-body">
          <h2>Upload Material</h2>
          <form id="uploadFileForm">
            <input type="hidden" id="uploadSubjectId" value="" />
            <div class="form-group">
              <label>File Title</label>
              <input type="text" id="fileTitle" required placeholder="e.g. Chapter 1 Slides" />
            </div>
            <div class="form-group">
              <label>Select File</label>
              <input type="file" id="materialFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.mp4" required />
            </div>
            <button type="submit" class="btn-add-subject">
              <i class="fas fa-cloud-upload-alt"></i> Upload to Supabase
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Submission Modal -->
    <div class="modal" id="submissionModal">
      <div class="modal-content">
        <span class="close" onclick="closeSubmissionModal()">&times;</span>
        <div class="modal-body">
          <h2>Submit Assignment</h2>
          <form id="submissionForm">
            <input type="hidden" id="submissionTaskId" value="" />
            <input type="hidden" id="submissionSubjectId" value="" />
            <div class="form-group">
              <label>Your File</label>
              <input type="file" id="submissionFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required />
            </div>
            <div class="form-group">
              <label>Comments (Optional)</label>
              <textarea id="submissionComments" rows="3" placeholder="Any comments for your instructor..."></textarea>
            </div>
            <button type="submit" class="btn-add-subject">
              <i class="fas fa-paper-plane"></i> Submit
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Theme Script -->
    <script>
      (function() {
        const theme = localStorage.getItem("theme") || "dark";
        if (theme === "light") {
          document.body.classList.add("light-mode");
        }
      })();
    </script>

    <!-- Scripts -->
    <script type="module" src="firebase.js"></script>
    <script type="module" src="script.js"></script>

    <!-- Task Management Functions -->
    <script>
      // Task Modal Functions
      window.openTaskModal = function(subjectId, taskId = null) {
        const modal = document.getElementById('addTaskModal');
        const form = document.getElementById('addTaskForm');
        const title = document.getElementById('taskModalTitle');
        const btnText = document.getElementById('taskBtnText');
        
        if (taskId) {
          title.textContent = 'Edit Task';
          btnText.textContent = 'Update Task';
          // Load existing task data (would be populated from script.js)
        } else {
          title.textContent = 'Add New Task';
          btnText.textContent = 'Save Task';
          form.reset();
        }
        
        modal.style.display = 'block';
      };

      window.closeTaskModal = function() {
        document.getElementById('addTaskModal').style.display = 'none';
      };

      // Upload Modal Functions
      window.openUploadModal = function(subjectId) {
        document.getElementById('uploadSubjectId').value = subjectId;
        document.getElementById('uploadFileModal').style.display = 'block';
      };

      window.closeUploadModal = function() {
        document.getElementById('uploadFileModal').style.display = 'none';
      };

      // Submission Modal Functions
      window.openSubmissionModal = function(taskId, subjectId) {
        document.getElementById('submissionTaskId').value = taskId;
        document.getElementById('submissionSubjectId').value = subjectId;
        document.getElementById('submissionModal').style.display = 'block';
      };

      window.closeSubmissionModal = function() {
        document.getElementById('submissionModal').style.display = 'none';
      };

      // Close modals when clicking outside
      window.addEventListener('click', function(e) {
        if (e.target.classList.contains('modal')) {
          e.target.style.display = 'none';
        }
      });
    </script>
  </body>
</html>
