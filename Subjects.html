          <!-- Inline form handler - waits for Firebase to load -->
          <script>
            function initAddSubjectForm() {
              const form = document.getElementById('addSubjectForm');
              const modal = document.getElementById('addSubjectModal');
              const addBtn = document.getElementById('addSubjectBtn');
              
              if (!form) {
                setTimeout(initAddSubjectForm, 100);
                return;
              }
              
              console.log('Add Subject form initialized');
              
              // Open modal handler
              if (addBtn && modal) {
                addBtn.addEventListener('click', function() {
                  modal.style.display = 'block';
                });
              }
              
              // Close modal when clicking outside
              window.addEventListener('click', function(e) {
                if (e.target === modal) {
                  modal.style.display = 'none';
                }
              });
              
              form.addEventListener('submit', function(e) {
                e.preventDefault();
                console.log('Form submitted');
                
                const name = document.getElementById('newSubjectName').value.trim();
                const teacher = document.getElementById('newTeacherName').value.trim();
                const time = document.getElementById('newSubjectTime').value.trim();
                const description = document.getElementById('newSubjectDescription').value.trim();
                
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                
                if (!name || !teacher || !time) {
                  alert('Please fill in all required fields');
                  return;
                }
                
                const subjectData = {
                  name: name,
                  teacher: teacher,
                  time: time,
                  description: description,
                  instructorId: userData.id,
                  instructorName: userData.name,
                  createdAt: new Date()
                };
                
                console.log('Saving:', subjectData);
                
                // Save to Firestore using the globally exposed db
                async function saveToFirestore() {
                  try {
                    // Dynamic import Firebase Firestore functions (modular syntax)
                    const { collection, addDoc } = await import('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js');
                    
                    // Use the already-initialized Firestore instance from firebase.js
                    const db = window.firebaseDb;
                    
                    console.log('Using Firestore:', db);
                    
                    // Use addDoc with collection - modular syntax
                    const docRef = await addDoc(collection(db, 'subjects'), subjectData);
                    console.log('Saved with ID:', docRef.id);
                    alert('Subject added successfully!');
                    form.reset();
                    modal.style.display = 'none';
                    location.reload();
                  } catch (err) {
                    console.error('Error:', err);
                    alert('Error saving: ' + err.message);
                  }
                }
                
                saveToFirestore();
              });
            }
            
            initAddSubjectForm();
          </script>
